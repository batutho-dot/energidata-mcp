[project]
name = "energidata-mcp"
version = "0.1.0"
description = "MCP server for Danish electricity CO2 intensity and day-ahead prices (Energinet's Energi Data Service)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "energy", "co2", "electricity", "denmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "anyio>=4",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/batutho-dot/energidata-mcp"

[project.scripts]
energidata-mcp = "energidata_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energidata_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
