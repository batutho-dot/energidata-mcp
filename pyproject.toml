[project]
name = "energidata-mcp"
version = "0.1.0"
description = "MCP server for Danish electricity CO2 intensity and day-ahead prices (Energinet's Energi Data Service)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "anyio>=4",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
energidata-mcp = "energidata_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energidata_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
